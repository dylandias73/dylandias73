<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="150" viewBox="0 0 1200 150" role="img" aria-labelledby="title desc">
  <title id="title">Dylan Dias — AI Automation Engineer</title>
  <desc id="desc">Minimal dark animated header with a subtle moving scan line and technical grid.</desc>
  <defs>
    <pattern id="grid" width="28" height="28" patternUnits="userSpaceOnUse">
      <path d="M28 0H0V28" fill="none" stroke="#29312B" stroke-width="0.7" opacity=".65"/>
    </pattern>
    <linearGradient id="fade" x1="0" x2="1">
      <stop offset="0" stop-color="#0B0E0C"/>
      <stop offset=".72" stop-color="#101511"/>
      <stop offset="1" stop-color="#0B0E0C"/>
    </linearGradient>
    <clipPath id="clip">
      <rect width="1200" height="150" rx="8"/>
    </clipPath>
  </defs>
  <g clip-path="url(#clip)">
    <rect width="1200" height="150" fill="url(#fade)"/>
    <rect width="1200" height="150" fill="url(#grid)"/>
    <path d="M0 119H1200" stroke="#354137" stroke-width="1"/>
    <path d="M0 24H1200" stroke="#202820" stroke-width="1"/>
    <path d="M52 0V150M1148 0V150" stroke="#273129" stroke-width="1"/>
    <path d="M72 103H330" stroke="#8BCB75" stroke-width="2" opacity=".9"/>
    <path d="M1045 42V108" stroke="#8BCB75" stroke-width="2" opacity=".8"/>
    <text x="72" y="69" fill="#F0F2EF" font-family="Arial, Helvetica, sans-serif" font-size="31" font-weight="700" letter-spacing="5">DYLAN DIAS</text>
    <text x="72" y="94" fill="#A7B0A6" font-family="Arial, Helvetica, sans-serif" font-size="12" letter-spacing="3.2">AI AUTOMATION ENGINEER</text>
    <text x="1074" y="64" fill="#D5DDD3" font-family="Arial, Helvetica, sans-serif" font-size="10" letter-spacing="2">BUILD</text>
    <text x="1074" y="84" fill="#D5DDD3" font-family="Arial, Helvetica, sans-serif" font-size="10" letter-spacing="2">AUTOMATE</text>
    <text x="1074" y="104" fill="#D5DDD3" font-family="Arial, Helvetica, sans-serif" font-size="10" letter-spacing="2">REFINE</text>
    <rect x="-180" y="0" width="110" height="150" fill="#8BCB75" opacity=".055">
      <animate attributeName="x" from="-180" to="1280" dur="8s" repeatCount="indefinite"/>
    </rect>
    <path d="M0 0V150" stroke="#8BCB75" stroke-width="1" opacity=".7">
      <animate attributeName="d" values="M0 0V150;M1200 0V150;M0 0V150" dur="8s" repeatCount="indefinite"/>
    </path>
    <circle cx="330" cy="103" r="2" fill="#8BCB75">
      <animate attributeName="opacity" values=".25;1;.25" dur="2.4s" repeatCount="indefinite"/>
    </circle>
    <circle cx="1045" cy="42" r="2" fill="#8BCB75">
      <animate attributeName="opacity" values="1;.25;1" dur="2.4s" repeatCount="indefinite"/>
    </circle>
  </g>
</svg>
